<title>產業地圖</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1c2026; --muted: #68707d; --line: #e3e6eb;
  --accent: #2456c7; --accent-bg: #e9effc; --up: #c62828; --down: #1b7f3b; --warn: #b26a00;
  --up-bg: #fdecec; --down-bg: #e8f5ec; --warn-bg: #fff4e0; --hover: #f0f3f8;
  --edge: #8a93a3; --bar: #9db3e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --text: #e6e9ee; --muted: #98a1ae; --line: #2c323c;
    --accent: #7ea6ff; --accent-bg: #1f2b45; --up: #ff7b72; --down: #56d37f; --warn: #f0b24a;
    --up-bg: #3a1f1f; --down-bg: #17321f; --warn-bg: #3a2c12; --hover: #232832;
    --edge: #6b7482; --bar: #4a628f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px;
  display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; position: sticky; top: 0; z-index: 5; }
h1 { font-size: 17px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 4px; }
h3 { font-size: 14px; margin: 16px 0 6px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.built { margin-left: auto; color: var(--muted); font-size: 12px; }
main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 60px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 10px; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }
.tag { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px; line-height: 20px; white-space: nowrap; }
.tag.report { background: var(--accent-bg); color: var(--accent); }
.tag.guess { border: 1px dashed var(--edge); color: var(--muted); }
.tag.layer { background: var(--hover); color: var(--muted); }
.chains { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chains button { border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 6px 14px; border-radius: 8px;
  font: inherit; font-weight: 600; cursor: pointer; }
.chains button span { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 4px; }
.chains button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chains button.on span { color: #fff; opacity: .85; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend svg { vertical-align: middle; }

/* 地圖 */
.mapwrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px 6px; }
.map { position: relative; display: grid; gap: 0 40px; }
.map svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.col { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
.colhead { padding: 4px 2px 6px; border-bottom: 2px solid var(--line); margin-bottom: 2px; }
.colhead b { font-size: 13.5px; }
.colhead div { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer;
  transition: opacity .15s, border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--accent); }
.card.focus { border-width: 2px; border-color: var(--accent); }
.card.sel { box-shadow: 0 0 0 3px var(--accent-bg); border-color: var(--accent); }
.card.dim { opacity: .28; }
.card .nm { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: baseline; }
.card .nm span { font-weight: 400; color: var(--muted); font-size: 12px; }
.card .role { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.card .mt { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 12px; margin-top: 5px; font-variant-numeric: tabular-nums; }
.card .mt span { white-space: nowrap; }
path.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; transition: opacity .15s; }
path.edge.guess { stroke-dasharray: 5 4; }
path.edge.dim { opacity: .12; }
path.edge.hi { stroke: var(--accent); stroke-width: 2; }

/* 明細 */
.dhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.dhead h2 { font-size: 19px; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.cols2 > div { min-width: 0; }
@media (max-width: 820px) { .cols2 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { header { padding: 10px 16px; } .built { margin-left: 0; width: 100%; } main { padding: 12px 10px 40px; } .panel { padding: 12px; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 14px; padding: 1px 10px; font-size: 12.5px; }
ul.pts { margin: 4px 0; padding-left: 20px; }
ul.pts li { margin: 2px 0; }
.rel { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rel:last-child { border-bottom: 0; }
.rel .who { font-weight: 600; cursor: pointer; color: var(--accent); }
.rel .src { font-size: 12px; }
.chart { width: 100%; height: auto; display: block; }
.chart .ax { font-size: 10.5px; fill: var(--muted); }
.chart line.grid { stroke: var(--line); }
.chart line.zero { stroke: var(--muted); }
.chart rect.hit { fill: transparent; }
.chart rect.hit:hover { fill: var(--hover); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
th.l, td.l { text-align: left; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--text); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--hover); }
tbody tr.sel { background: var(--accent-bg); }
#tip { position: fixed; pointer-events: none; background: var(--text); color: var(--panel); font-size: 12px; padding: 5px 8px;
  border-radius: 6px; display: none; z-index: 20; white-space: nowrap; font-variant-numeric: tabular-nums; }
</style>

const cls = (x) => (x > 0 ? "up" : x < 0 ? "down" : "");

const fmtNum = (x, d = 0) => (x == null ? "–" : x.toLocaleString("en-US", { maximumFractionDigits: d }));
const mon = (m) => `${+m.slice(5)} 月`;

// ---------- 每家公司的衍生數字
function stats(id) {
  const r = D.rev[id] || [], p = D.px[id];
  const out = { rev: r };
  if (r.length) {
    const last = r[r.length - 1];
    out.month = last[0]; out.revLast = last[1]; out.yoy = last[2];
    const byM = new Map(r.map((x) => [x[0], x[1]]));
    const ago = (m, k) => { let [y, mm] = m.split("-").map(Number); mm -= k; while (mm < 1) { mm += 12; y--; } return `${y}-${String(mm).padStart(2, "0")}`; };
    const sum = (ms) => (ms.every((m) => byM.has(m)) ? ms.reduce((t, m) => t + byM.get(m), 0) : null);
    const span = (end, n) => Array.from({ length: n }, (_, i) => ago(end, i));
    const s3 = sum(span(out.month, 3)), s3p = sum(span(ago(out.month, 12), 3));
    const s12 = sum(span(out.month, 12)), s12p = sum(span(ago(out.month, 12), 12));
    out.yoy3 = s3 && s3p ? (s3 / s3p - 1) * 100 : null;
    out.yoy12 = s12 && s12p ? (s12 / s12p - 1) * 100 : null;
    out.rev12 = s12;
    const prevMax = Math.max(...r.slice(0, -1).map((x) => x[1]));
    out.high = r.length > 12 && last[1] > prevMax;
    out.span = r.length;
  }
  if (p && p.c.length) {
    const c = p.c, n = c.length;
    out.close = c[n - 1]; out.date = p.d[n - 1]; out.dayPct = p.pct[n - 1];
    out.r20 = n > 20 ? (c[n - 1] / c[n - 21] - 1) * 100 : null;
    out.r60 = n > 60 ? (c[n - 1] / c[n - 61] - 1) * 100 : null;
    out.mcap = p.shares ? (c[n - 1] * p.shares) / 1e8 : null;
  }

// 沿著關係往上游、往下游一路找下去
function chainOf(id) {
  const up = new Set(), down = new Set(), edges = new Set();
  const walk = (start, dir, seen) => {
    const stack = [start];
    while (stack.length) {
      const x = stack.pop();
      CH_EDGES.forEach((i) => {
        const e = M.edges[i], [a, b] = dir > 0 ? [e.from, e.to] : [e.to, e.from];
        if (a === x) { edges.add(i); if (!seen.has(b) && b !== start) { seen.add(b); stack.push(b); } }
      });
    }
  };
  walk(id, 1, down); walk(id, -1, up);
  return { nodes: new Set([id, ...up, ...down]), edges };
}

    const e = M.edges[i], a = rect[e.from], b = rect[e.to];
    if (!a || !b) return;
    const fwd = layerOf(e.to) > layerOf(e.from), same = layerOf(e.to) === layerOf(e.from);
    const x1 = fwd || same ? a.r : a.l, x2 = fwd ? b.l - 6 : b.r + 6, dx = Math.max(24, Math.abs(x2 - x1) / 2) * (fwd ? 1 : -1);
    const hi = ch.edges.has(i);
    // 同一層的兩家（例如台虹 → 台光電）從右側繞出去再接回來
    const d = same ? `M${x1},${a.y} C${x1 + 30},${a.y} ${x2 + 24},${b.y} ${x2},${b.y}` : `M${x1},${a.y} C${x1 + dx},${a.y} ${x2 - dx},${b.y} ${x2},${b.y}`;
    paths += `<path class="edge ${e.conf}${hi ? " hi" : " dim"}" marker-end="url(#${hi ? "ah" : "a"})" d="${d}"/>`;
  });
  const mk = (id, c) => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${c}"/></marker>`;
  svg.innerHTML = `<defs>${mk("a", "var(--edge)")}${mk("ah", "var(--accent)")}</defs>${paths}`;
}

// ---------- 圖表（SVG，滑過顯示數字）
const tip = document.getElementById("tip");
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = "block"; const x = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8); tip.style.left = x + "px"; tip.style.top = ev.clientY + 14 + "px"; }
function hideTip() { tip.style.display = "none"; }
const TIPS = [];
function tipAttr(html) { TIPS.push(html); return `onmousemove="showTip(event,TIPS[${TIPS.length - 1}])" onmouseleave="hideTip()"`; }

function revChart(r) {
  const W = 620, H = 170, L = 40, R = 6, T = 10, B = 22, n = r.length;
  const max = Math.max(...r.map((x) => x[1])) * 1.08, bw = (W - L - R) / n;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const step = niceStep(max / 1e5);
  let g = "";
  for (let v = step; v * 1e5 < max; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v * 1e5)}" y2="${y(v * 1e5)}"/><text class="ax" x="${L - 4}" y="${y(v * 1e5) + 3}" text-anchor="end">${fmtNum(v, 1)}</text>`;
  const bars = r.map((x, i) => {
    const h = H - B - y(x[1]), last = i === n - 1;
    return `<path d="${roundTop(L + i * bw + 1, y(x[1]), bw - 2, h)}" fill="${last ? "var(--accent)" : "var(--bar)"}"/>
      <rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" ${tipAttr(`${x[0]}　營收 ${yi(x[1])} 億　年增 ${pct(x[2])}`)}/>`;
  }).join("");
  const xl = r.map((x, i) => (x[0].endsWith("-01") || i === 0 ? `<text class="ax" x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${x[0].slice(0, 4)}</text>` : "")).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<line class="zero" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>${bars}${xl}<text class="ax" x="2" y="10">億元</text></svg>`;
}
function yoyChart(r) {
  const W = 620, H = 130, L = 40, R = 6, T = 8, B = 8, n = r.length, v = r.map((x) => x[2] ?? 0);
  const hi = Math.max(10, ...v), lo = Math.min(-10, ...v), bw = (W - L - R) / n;
  const y = (x) => T + (H - T - B) * (hi - x) / (hi - lo);
  const step = niceStep((hi - lo) / 1.5);
  let g = "";
  for (let k = Math.ceil(lo / step) * step; k <= hi; k += step) if (k) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(k)}" y2="${y(k)}"/><text class="ax" x="${L - 4}" y="${y(k) + 3}" text-anchor="end">${k}%</text>`;
  const bars = r.map((x, i) => {
    if (x[2] == null) return "";
    const y0 = y(0), y1 = y(x[2]);
    return `<rect x="${L + i * bw + 1}" y="${Math.min(y0, y1)}" width="${bw - 2}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="1.5" fill="var(--${x[2] >= 0 ? "up" : "down"})" opacity=".8"/>
      <rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" ${tipAttr(`${x[0]}　年增 ${pct(x[2])}`)}/>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/><text class="ax" x="${L - 4}" y="${y(0) + 3}" text-anchor="end">0</text>${bars}</svg>`;
}
function pxChart(p) {
  const W = 620, H = 160, L = 44, R = 8, T = 10, B = 22, c = p.c, n = c.length;
  const hi = Math.max(...c), lo = Math.min(...c), pad = (hi - lo) * 0.08 || 1;
  const y = (v) => T + (H - T - B) * (hi + pad - v) / (hi - lo + 2 * pad), x = (i) => L + (W - L - R) * i / Math.max(1, n - 1);
  const step = niceStep((hi - lo + 2 * pad) / 1.2);
  let g = "";
  for (let v = Math.ceil((lo - pad) / step) * step; v <= hi + pad; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${fmtNum(v, 1)}</text>`;
  const line = c.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const months = p.d.map((d, i) => [d, i]).filter(([d], i) => i === 0 || d.slice(5, 7) !== p.d[i - 1].slice(5, 7));
  const xl = months.map(([d, i]) => `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${+d.slice(5, 7)}月</text>`).join("");
  const hits = c.map((v, i) => `<rect class="hit" x="${x(i) - (W - L - R) / n / 2}" y="${T}" width="${(W - L - R) / n}" height="${H - T - B}" ${tipAttr(`${p.d[i]}　收盤 ${fmtNum(v, 2)}${p.pct[i] != null ? "　" + pct(p.pct[i], 2) : ""}`)}/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${x(n - 1)}" cy="${y(c[n - 1])}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>${xl}${hits}</svg>`;
}
function niceStep(range) {
  const raw = range / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function roundTop(x, y, w, h) {
  const r = Math.min(2, w / 2, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}

// ---------- 明細
const srcLinks = (ids) => (ids || []).map((k) => M.sources[k]).filter(Boolean).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">${esc(s.title.split("：")[0])}</a>`).join("、");
const confTag = (c) => (c === "report" ? '<span class="tag report" title="媒體或研究報導提到">報導</span>' : '<span class="tag guess" title="依產業結構推測，沒有找到直接來源">推測</span>');
function relRows(list, side) {
  if (!list.length) return `<div class="muted" style="padding:6px 0">目前地圖上沒有整理到${side}</div>`;
  return list.map((e) => {
    const other = NODES.get(side === "上游供應商" ? e.from : e.to);
    const away = CH_LAYER.has(other.id) ? "" : ` <span class="tag layer" title="不在目前這張地圖上，點了會切換">${esc(chainsOf(other.id).map((c) => c.name).join("、"))}</span>`;
    return `<div class="rel"><span class="who" onclick="select('${esc(other.id)}')">${esc(other.name)}${other.tw ? " " + esc(other.id) : ""}</span>${away}
      <span>${esc(e.label)}</span>${confTag(e.conf)}${e.src && e.src.length ? `<span class="src muted">來源：${srcLinks(e.src)}</span>` : ""}</div>`;
  }).join("");
}
function detailHtml() {
  const n = NODES.get(state.sel), s = S.get(n.id), layer = CH.layers[layerOf(n)];
  TIPS.length = 0;
  const ups = M.edges.filter((e) => e.to === n.id), downs = M.edges.filter((e) => e.from === n.id);
  const peers = layer.nodes.filter((x) => x !== n.id).map((x) => NODES.get(x));
  const others = chainsOf(n.id).filter((c) => c.id !== CH.id);
  let tiles = "", charts = "", etf = "";
  if (s) {
    const tile = (k, v, sub, c = "") => `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div><div class="s">${sub || "&nbsp;"}</div></div>`;
    tiles = `<div class="tiles">
      ${s.month ? tile(`${s.month} 營收`, yi(s.revLast) + " 億", s.high ? `近 ${s.span} 個月新高` : "") : ""}
      ${s.month ? tile("單月年增", pct(s.yoy), "", cls(s.yoy)) : ""}
      ${tile("近 3 個月年增", pct(s.yoy3), "和去年同期 3 個月合計比", cls(s.yoy3))}
      ${tile("近 12 個月年增", pct(s.yoy12), s.rev12 ? `近 12 個月 ${yi(s.rev12)} 億` : "", cls(s.yoy12))}
      ${s.close != null ? tile("股價", fmtNum(s.close, 2), `${s.date}　${pct(s.dayPct, 2)}`, "") : ""}
      ${s.close != null ? tile("20 日／60 日", `<span class="${cls(s.r20)}">${pct(s.r20)}</span> <span class="muted" style="font-weight:400">/</span> <span class="${cls(s.r60)}">${pct(s.r60)}</span>`, "未還原除權息") : ""}
      ${s.mcap ? tile("市值", fmtNum(s.mcap) + " 億", "") : ""}
      ${tile("追蹤中 ETF 持有", s.held.length + " 檔", s.held.length ? "權重最高 " + esc(s.held[0][0]) + " " + (s.held[0][2] ?? 0).toFixed(2) + "%" : "")}
    </div>`;
    charts = `<div class="cols2">
      <div><h3>月營收（近 ${s.rev.length} 個月）</h3>${s.rev.length ? revChart(s.rev) + `<div class="hint" style="margin-top:2px">單月年增率</div>` + yoyChart(s.rev) : '<div class="muted">沒有營收資料</div>'}</div>
      <div><h3>股價</h3>${D.px[n.id] ? pxChart(D.px[n.id]) + `<p class="hint">收盤價，${D.px[n.id].d[0]} 起；資料來源和 ETF 網站的行情相同，未還原除權息。</p>` : '<div class="muted">沒有股價資料</div>'}
        <h3>追蹤中 ETF 的持股</h3>${s.held.length ? `<div class="scroll"><table><thead><tr><th class="l">ETF</th><th class="l">名稱</th><th>權重</th><th>持股（張）</th><th class="l">資料日</th></tr></thead><tbody>
        ${s.held.map((h) => `<tr><td class="l"><a href="index.html#tab=etf&etf=${encodeURIComponent(h[0])}">${esc(h[0])}</a></td><td class="l">${esc(h[1])}</td>
          <td>${h[2] == null ? "–" : h[2].toFixed(2) + "%"}</td><td>${h[3] == null ? "–" : fmtNum(h[3] / 1000)}</td><td class="l muted">${h[4]}</td></tr>`).join("")}</tbody></table></div>`
        : '<div class="muted">追蹤中的 ETF 目前都沒有持有</div>'}</div></div>`;
  }
  return `<div class="panel" id="detail">
    <div class="dhead"><h2>${esc(n.name)} ${n.tw ? `<span class="muted" style="font-weight:400">${esc(n.id)}</span>` : `<span class="muted" style="font-weight:400">${esc(n.market)}</span>`}</h2>
      <span class="tag layer">${esc(layer.name)}</span><span class="muted">${esc(n.role)}</span>
      ${others.length ? `<span class="muted">也在：${others.map((c) => `<a onclick="useChain('${c.id}');writeHash();render()" style="cursor:pointer">${esc(c.title)}</a>`).join("、")}</span>` : ""}</div>
    ${tiles}
    <p style="margin:8px 0">${esc(n.desc)}</p>
    ${n.products && n.products.length ? `<div class="chips">${n.products.map((p) => `<span class="chip">${esc(p)}</span>`).join("")}</div>` : ""}
    ${n.points && n.points.length ? `<h3>近期重點</h3><ul class="pts">${n.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
    <div class="cols2">
      <div><h3>上游供應商</h3>${relRows(ups, "上游供應商")}</div>
      <div><h3>下游客戶</h3>${relRows(downs, "下游客戶")}</div>
    </div>
    ${peers.length ? `<h3>同一層的公司</h3><div class="chips">${peers.map((p) => `<span class="chip" style="cursor:pointer" onclick="select('${esc(p.id)}')">${esc(p.name)}${p.tw ? " " + esc(p.id) : ""}</span>`).join("")}</div>` : ""}
    ${charts}
    ${n.src && n.src.length ? `<p class="hint" style="margin-top:14px">公司描述來源：${srcLinks(n.src)}</p>` : `<p class="hint" style="margin-top:14px">公司描述是一般產業資訊整理，沒有附特定來源。</p>`}
  </div>`;
}

// ---------- 同業比較表
function peerHtml() {
  const rows = M.nodes.filter((n) => n.tw && CH_LAYER.has(n.id)).map((n) => ({ n, s: S.get(n.id) }));
  const KEYS = { layer: (x) => -layerOf(x.n), name: (x) => x.n.id, rev: (x) => x.s.revLast ?? -1e18, yoy: (x) => x.s.yoy ?? -1e9,
    yoy3: (x) => x.s.yoy3 ?? -1e9, yoy12: (x) => x.s.yoy12 ?? -1e9, r20: (x) => x.s.r20 ?? -1e9, r60: (x) => x.s.r60 ?? -1e9,
    mcap: (x) => x.s.mcap ?? -1, held: (x) => x.s.held.length };
  const k = KEYS[state.sort] || KEYS.yoy;
  rows.sort((a, b) => { const x = k(a), y = k(b); return (x < y ? 1 : x > y ? -1 : 0) * state.dir; });
  const th = (key, label, l) => `<th class="sort${l ? " l" : ""}" onclick="sortBy('${key}')">${label}${state.sort === key ? (state.dir > 0 ? " ▼" : " ▲") : ""}</th>`;
  return `<div class="panel"><h2>同業比較</h2>
    <p class="hint">這張地圖上的台股公司；點欄位標題排序，點一列看明細。「近 3 個月年增」是最近 3 個月營收合計和去年同期比，比單月年增穩定。股價漲跌未還原除權息。</p>
    <div class="scroll"><table><thead><tr>${th("name", "公司", 1)}${th("layer", "層級", 1)}${th("rev", "最新月營收（億）")}${th("yoy", "單月年增")}
      ${th("yoy3", "近 3 個月年增")}${th("yoy12", "近 12 個月年增")}${th("r20", "20 日")}${th("r60", "60 日")}${th("mcap", "市值（億）")}${th("held", "ETF 持有")}</tr></thead><tbody>
    ${rows.map(({ n, s }) => `<tr class="click${n.id === state.sel ? " sel" : ""}" onclick="select('${esc(n.id)}')">
      <td class="l"><b>${esc(n.name)}</b> <span class="muted">${esc(n.id)}</span></td><td class="l muted">${esc(CH.layers[layerOf(n)].name)}</td>
      <td>${s.revLast ? yi(s.revLast) : "–"} <span class="muted">${s.month ? mon(s.month) : ""}</span></td>
      <td class="${cls(s.yoy)}">${pct(s.yoy)}</td><td class="${cls(s.yoy3)}">${pct(s.yoy3)}</td><td class="${cls(s.yoy12)}">${pct(s.yoy12)}</td>
      <td class="${cls(s.r20)}">${pct(s.r20)}</td><td class="${cls(s.r60)}">${pct(s.r60)}</td><td>${s.mcap ? fmtNum(s.mcap) : "–"}</td><td>${s.held.length}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
function sortBy(k) { state.dir = state.sort === k ? -state.dir : 1; state.sort = k; render(); }

// ---------- 畫面
function render() {
  const focus = NODES.get(CH.focus);
  const tabs = M.chains.map((c) => `<button class="${c.id === CH.id ? "on" : ""}" onclick="pickChain('${c.id}')">${esc(c.name)}<span>${esc(NODES.get(c.focus).name)} ${esc(c.focus)}</span></button>`).join("");
  const line = (dash) => `<svg width="34" height="10"><path d="M1,5 H33" stroke="var(--edge)" stroke-width="1.5" ${dash ? 'stroke-dasharray="5 4"' : ""}/></svg>`;
  document.getElementById("app").innerHTML = `
  <div class="panel">
    <div class="chains">${tabs}</div>
    <h2>${esc(CH.title)}${focus ? `（從 ${esc(focus.name)} ${esc(focus.id)} 出發）` : ""}</h2>
    <p class="hint">由左到右是上游到下游。滑過或點一家公司，會標出它一路往上游、往下游連到的公司；點了之後下方顯示細節，包括每條關係供應什麼、消息來源。卡片上是最新一個月的營收年增率和近 20 個交易日股價漲跌。
      上下游關係是人工整理（${esc(CH.updated)}），公司通常不公開客戶名單，請以「報導」「推測」標記判斷可信度。</p>
    <div class="legend"><span>${line(false)} 報導提到的供貨關係</span><span>${line(true)} 依產業結構推測</span>
      <span><span class="tag report">新高</span> 單月營收創資料期間新高</span><span class="up">紅＝上漲／成長</span><span class="down">綠＝下跌／衰退</span></div>
  </div>
  <div class="panel">${mapHtml()}</div>
  ${detailHtml()}
  ${peerHtml()}`;
  requestAnimationFrame(paintChain);
}
document.getElementById("built").textContent = "資料更新 " + D.built;
addEventListener("resize", () => paintChain());
render();
</script>
</body>
</html>
